# Smoke-only: 3 SST-2 arms using the 4-layer local GPT and shared tokenizer.
# The default command is a dry-run; --execute needs prior local pretraining.
schema_version: 1
base_config: configs/finetune_smoke.yaml
default_model_config: configs/model/gpt_mini.yaml
runs_dir: runs/smoke_ablations
tokenizer_artifact: runs/exp_local/tokenizer
pretrained_path: runs/exp_local/checkpoints/latest.pt
suites:
  - id: smoke
    tasks: [sst2]
    seeds: [42]
    variants:
      - id: full
      - id: no_pretrain
        no_pretrain: true
      - id: no_aux
        aux_lm_lambda: [0.0]
