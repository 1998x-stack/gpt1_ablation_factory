# Compact local smoke matrix; use paper_ablations.yaml for full research.
schema_version: 1
base_config: configs/finetune_glue.yaml
default_model_config: configs/model/gpt_mini.yaml
runs_dir: runs/smoke_ablations
tokenizer_artifact: runs/exp_local/tokenizer
pretrained_path: runs/exp_local/checkpoints/latest.pt
suites:
  - id: smoke
    tasks: [sst2]
    seeds: [42]
    variants:
      - id: full
      - id: no_pretrain
        no_pretrain: true
      - id: no_aux
        aux_lm_lambda: [0.0]
