model:
  name: gpt_decoder
  vocab_size: 50257           # overridden by trained tokenizer
  n_layer: 12
  n_head: 12
  d_model: 768
  d_ff: 3072
  max_len: 512
  dropout: 0.1
  attn_dropout: 0.1
  resid_dropout: 0.1
  layer_norm_eps: 1.0e-5
  tie_emb: true
  norm_style: post_ln
  final_layer_norm: false
  gelu: true
