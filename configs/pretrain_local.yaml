exp:
  out_dir: "runs/exp_local"
  seed: 42

include:
  - "configs/model/gpt_mini.yaml"
  - "configs/data/books_local.yaml"

optim:
  lr: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 150
  max_steps: 1000
  scheduler: "cosine"
  grad_clip: 1.0
  amp: false

checkpoint:
  save_every: 100
  keep_last: 3
